
# Human-readable mod name
modName = Crystal Graphics

# Case-sensitive mod identifier
modId = crystalgraphics

# Root package
modGroup = com.crystalgraphics

# Mod version
modVersion = 1.0.0


# Non-GTNH Gradle flags
# CC disabled: ModDevGradle (runtime/mc/modern/forge legacyForge, runtime/mc/modern/neoforge) does not support configuration cache.
org.gradle.configuration-cache = false
org.gradle.parallel = true
# 4 GB heap: Forge/NeoForge deobfuscation pipeline (SRG remapping, MC decompile) is memory-intensive.
org.gradle.jvmargs=-Xmx4g -Xms1g

# Shared dependency versions — referenced by :core, :platform, and :runtime:mc:1710 build scripts
# via rootProject.properties["dep.*"] to avoid duplicating version strings.
dep.lombok = 1.18.40
dep.joml = 1.10.1
dep.lwjgl = 2.9.4-nightly-20150209
dep.log4j = 2.0-beta9
dep.jabel = 1.0.0
dep.junit = 4.13.2
dep.jdk.toolchain = 17

## The 1.20.x era's toolchain-wide pins
#
# EVERY OTHER modern pin is per node, in runtime/mc/modern/<branch>/versions/<version>/gradle.properties:
# a node IS a Minecraft version, and a root-level key cannot describe two of them.
modern.mixin            = 0.8.5
modern.mixinextras      = 0.3.5

# Tier 1's LWJGL3, and the reason it is not the newest.
#
# The oldest target the runtime/lwjgl/3 tier serves is MC 1.13-1.16, which ships LWJGL 3.2.x.
# Compiling that tier against 3.2.2 is what makes "no symbol a 1.16 client lacks" a compile error
# rather than a NoSuchMethodError on somebody's machine -- requirement F1. It has already caught
# one: three GLFW 3.4 cursor constants, dropped rather than hardcoded (see GlfwCursorService).
#
# RAISING THIS IS A SCOPE DECISION, not a fix. If a compile fails against it, the question is whether
# the tier still serves 1.13-1.16 -- not whether a newer LWJGL would make the error go away.
dep.lwjgl3.tier1 = 3.2.2
