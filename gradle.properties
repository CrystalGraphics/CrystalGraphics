# Root gradle.properties — universal project config only.
#
# MC version-specific properties (minecraftVersion, forgeVersion, mixins, coreModClass, etc.)
# live in the version subproject: mc1710/gradle.properties
#
# NOTE: gtnhsettingsconvention (applied in settings.gradle.kts) reads from this file at
# settings-evaluation time. modName/modId/modGroup are kept here for that reason.

# GTNH settings convention
gtnh.settings.blowdryerTag = 0.2.2

# Human-readable mod name
modName = Crystal Graphics

# Case-sensitive mod identifier
modId = crystalgraphics

# Root package
modGroup = com.crystalgraphics

# Mod version
modVersion = 1.0.0

# Enables modern Java syntax support. Valid values:
# - false: No modern syntax, Java 8 only
# - jabel: Jabel syntax-only support, compiles to J8 bytecode
# - jvmDowngrader: Full modern Java via JVM Downgrader (syntax + stdlib APIs)
# - modern: Native modern Java bytecode, no downgrading
enableModernJavaSyntax = jabel

# Whether to use modGroup as the maven publishing group.
useModGroupForPublishing = true

# Updates your build.gradle and settings.gradle automatically whenever an update is available.
autoUpdateBuildScript = false

# Override the IDEA build type.
ideaOverrideBuildType = idea

# Uncomment this to disable Spotless checks.
disableSpotless = true

# Uncomment this to disable Checkstyle checks (currently wildcard import check).
disableCheckstyle = true

# Non-GTNH Gradle flags
org.gradle.configuration-cache = true
org.gradle.parallel = true

# Shared dependency versions — referenced by :core, :platform, and :mc1710 build scripts
# via rootProject.properties["dep.*"] to avoid duplicating version strings.
dep.lombok = 1.18.32
dep.joml = 1.10.1
dep.lwjgl = 2.9.4-nightly-20150209
dep.log4j = 2.0-beta9
dep.jabel = 1.0.0
dep.junit = 4.13.2
dep.jdk.toolchain = 17
