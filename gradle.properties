
# Human-readable mod name
modName = Crystal Graphics

# Case-sensitive mod identifier
modId = crystalgraphics

# Root package
modGroup = com.crystalgraphics

# Mod version
modVersion = 1.0.0


# Non-GTNH Gradle flags
# CC disabled: ModDevGradle (runtime/mc/modern/forge legacyForge, runtime/mc/modern/neoforge) does not support configuration cache.
org.gradle.configuration-cache = false
org.gradle.parallel = true
# 4 GB heap: Forge/NeoForge deobfuscation pipeline (SRG remapping, MC decompile) is memory-intensive.
org.gradle.jvmargs=-Xmx4g -Xms1g

# Shared dependency versions — referenced by :core, :platform, and :runtime:mc:1710 build scripts
# via rootProject.properties["dep.*"] to avoid duplicating version strings.
dep.lombok = 1.18.40
dep.joml = 1.10.1
dep.lwjgl = 2.9.4-nightly-20150209
dep.log4j = 2.0-beta9
dep.jabel = 1.0.0
dep.junit = 4.13.2
dep.jdk.toolchain = 17

## mc1201 version pins
#
# Keep these uncommented while mc1201 is in the build. The modules read them via
# rootProject.properties[...], which answers null rather than failing, so a commented pin surfaces as
# Loom reporting "Failed to find minecraft version: null".
mc1201.minecraft        = 1.20.1
mc1201.fabric.loader    = 0.15.11
mc1201.fabric.api       = 0.92.0+1.20.1
mc1201.forge            = 47.2.0
mc1201.parchment.mc     = 1.20.1
mc1201.parchment        = 2023.09.03
mc1201.mixin            = 0.8.5
mc1201.mixinextras      = 0.3.5
mc1201.java             = 17

# mc1201.neoforge and mc1201.neoform deleted rather than restored: NeoForge published no 20.1.x series
# and NeoForm no 1.20.1 artifact, so both named things that never existed, and nothing read them. The
# NeoForge module targets 1.20.4 via mc1204.* below; legacyForge exists for the same reason.

## mc1204 version pins (NeoForge retarget — runtime/mc/modern/neoforge/ targets MC 1.20.4)
# 20.4.251 is the last of the 20.4.x line.
mc1204.minecraft        = 1.20.4
mc1204.neoforge         = 20.4.251
mc1204.parchment.mc     = 1.20.4
mc1204.parchment        = 2024.04.14

# Tier 1's LWJGL3, and the reason it is not the newest.
#
# The oldest target the mc-lwjgl3 tier serves is MC 1.13-1.16, which ships LWJGL 3.2.x. Compiling that
# tier against 3.2.2 is what makes "no symbol a 1.16 client lacks" a compile error rather than a
# NoSuchMethodError on somebody's machine -- requirement F1. It has already caught one: three GLFW 3.4
# cursor constants, dropped rather than hardcoded (see GlfwCursorService).
#
# RAISING THIS IS A SCOPE DECISION, not a fix. If a compile fails against it, the question is whether
# the tier still serves 1.13-1.16 -- not whether a newer LWJGL would make the error go away.
dep.lwjgl3.tier1 = 3.2.2
