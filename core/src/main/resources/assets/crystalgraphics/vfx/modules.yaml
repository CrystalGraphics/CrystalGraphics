# The built-in modules' declarations (spec/modules.md as data): what aaa_validate.py checks a module entry's inputs
# against, and what the codecs are generated from. A number takes every form unless `forms` narrows it (modules.md).
# Every module that rolls also takes `seed` (modules.md § Declaration).
# An absent input takes its `default`, Unreal's, in Unreal's units: cm, Unreal's axes, degrees, seconds, linear colour.
# An input whose `visible_when` does not hold is not read; a list there is any of its values (modules.md § Declaration).
_v: 1
modules:
  # emitter update
  - { id: emitter_state, groups: [emitter_update], once: true, order: emitter, analytic: true, unreal: { niagara: EmitterState, cascade: [Required, Spawn] }, inputs: [
      { name: loop, type: enum, values: [infinite, multiple, once], default: infinite },
      { name: loop_count, type: int, default: 1, timeline: loop_count, visible_when: { loop: multiple } },
      { name: duration, type: float, quantity: time, default: 1 },
      { name: recalculate_each_loop, type: bool, default: false, visible_when: { loop: [infinite, multiple] } },
      { name: delay, type: float, quantity: time, default: 0 },
      { name: delay_first_loop_only, type: bool, default: false, visible_when: { loop: [infinite, multiple] } }, { name: recalculate_delay_each_loop, type: bool, default: false, visible_when: { loop: [infinite, multiple] } },
      { name: inactive, type: enum, values: [complete, kill], default: complete },
      { name: kill_on_complete, type: bool, default: false } ] }
  - { id: spawn_rate, groups: [emitter_update], analytic: true, unreal: { niagara: SpawnRate, cascade: [Spawn] }, inputs: [
      { name: rate, type: float, quantity: rate, by: [loop], default: 1 },
      { name: probability, type: float, default: 1 },
      { name: scale, type: float, by: [loop], default: 1 },
      { name: apply_global_scale, type: bool, default: true } ] }
  - { id: spawn_burst, groups: [emitter_update], analytic: true, unreal: { niagara: SpawnBurst_Instantaneous, cascade: [Spawn] }, inputs: [
      { name: time, type: float, quantity: time, default: 0, timeline: key_time },
      { name: count, type: int, forms: [constant, range], rolls: loop, timeline: key_value, default: 0 },
      { name: probability, type: float, default: 1 }, { name: loop_count_limit, type: int, default: 0 },
      { name: scale, type: float, by: [loop], default: 1 } ] }
  - { id: spawn_per_unit, groups: [emitter_update], unreal: { niagara: SpawnPerUnit, cascade: [SpawnPerUnit] }, inputs: [
      { name: spacing, type: float, quantity: length },
      { name: max_step, type: float, quantity: length },
      { name: per_unit, type: float, by: [loop] },
      { name: unit, type: float, quantity: length },
      { name: movement_tolerance, type: float }, { name: ignore_axes, type: string },
      { name: ignore_spawn_rate_when_moving, type: bool } ] }

  # particle spawn
