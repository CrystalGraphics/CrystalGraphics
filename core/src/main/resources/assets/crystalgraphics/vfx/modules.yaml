      { name: alpha, type: float, by: [loop], rolls: draw, default: 1 },
      { name: clamp_alpha, type: bool, default: true },
      { name: intensity, type: float, default: 1 },
      { name: sprite_size, type: vec2, quantity: length, default: [50, 50] }, { name: uniform, type: bool, default: false },
      { name: mesh_scale, type: vec3, rolls: draw, default: [1, 1, 1] }, { name: per_axis, type: bool, default: true },
      { name: sprite_rotation, type: float, quantity: angle, default: 0 },
      { name: mass, type: float, default: 1 }, { name: heat, type: float, default: 0 } ] }
  - { id: shape_location, groups: [particle_spawn], order: spawn_place, analytic: true, unreal: { niagara: ShapeLocation, cascade: [Location, LocationWorldOffset, LocationPrimitiveSphere, LocationPrimitiveCylinder, LocationPrimitiveTriangle] }, inputs: [
      { name: shape, type: enum, values: [point, sphere, box, cylinder, ring, cone, capsule, plane, triangle, torus, mesh], default: point },
      { name: sphere_radius, type: float, quantity: length, default: 100, visible_when: { shape: sphere } },
      { name: box_size, type: vec3, quantity: length, default: [100, 100, 100], visible_when: { shape: box } },
      { name: cylinder_radius, type: float, quantity: length, default: 100, visible_when: { shape: cylinder } },
      { name: cylinder_height, type: float, quantity: length, default: 100, visible_when: { shape: cylinder } },
      { name: cylinder_axis, type: enum, values: [x, y, z], default: z, visible_when: { shape: cylinder } },
      { name: ring_radius, type: float, quantity: length, default: 100, visible_when: { shape: ring } },
      { name: cone_length, type: float, quantity: length, default: 50, visible_when: { shape: cone } },
      { name: cone_angle, type: float, quantity: angle, default: 30, visible_when: { shape: cone } },
      { name: capsule_radius, type: float, quantity: length, visible_when: { shape: capsule } }, { name: capsule_height, type: float, quantity: length, visible_when: { shape: capsule } },
      { name: plane_size, type: vec2, quantity: length, default: [100, 100], visible_when: { shape: plane } }, { name: triangle, type: array, quantity: position, visible_when: { shape: triangle } },
      { name: torus_radius, type: float, quantity: length, default: 100, visible_when: { shape: torus } },
      { name: surface_only, type: bool, default: false }, { name: surface_thickness, type: float, quantity: length, default: 0, visible_when: { surface_only: true } },
      { name: edge_only, type: bool, default: false }, { name: hemisphere, type: bool, default: false }, { name: arc, type: float, quantity: angle, default: 360 },
      { name: directions, type: string, default: "+x-x+y-y+z-z" },
      { name: ordered, type: int, default: 0 },
      { name: rotation, type: rotation, default: [0, 0, 0] }, { name: scale, type: vec3, default: [1, 1, 1] },
      { name: offset, type: vec3, quantity: offset, by: [loop], default: [0, 0, 0] },
      { name: space, type: enum, values: [emitter, world], default: emitter },
      { name: mesh, type: mesh, forms: [data], visible_when: { shape: mesh } }, { name: vertices, type: bool, default: false, visible_when: { shape: mesh } },
      { name: add_velocity, type: struct, default: { outward: 0 } } ] }
  - { id: socket_location, groups: [particle_spawn], order: spawn_place, unreal: { niagara: SkeletalMeshLocation, cascade: [LocationBoneSocket] }, inputs: [
