      { name: inherit_velocity, type: float }, { name: inherit_rotation, type: float }, { name: follow, type: bool } ] }
  - { id: add_velocity, groups: [particle_spawn], order: spawn_launch, analytic: true, unreal: { niagara: AddVelocity, cascade: [Velocity, VelocityCone, VelocityInheritParent] }, inputs: [
      { name: mode, type: enum, values: [linear, in_cone, from_point, outward, inward], default: linear },
      { name: linear, type: vec3, quantity: speed, by: [loop], default: [0, 0, 0], visible_when: { mode: linear } },
      { name: outward, type: float, quantity: speed, by: [loop], default: 0 },
      { name: cone_axis, type: vec3, quantity: direction, default: [1, 0, 0], visible_when: { mode: in_cone } }, { name: cone_angle, type: float, quantity: angle, by: [loop], default: 45, visible_when: { mode: in_cone } },
      { name: inner_cone, type: float, quantity: angle, default: 0, visible_when: { mode: in_cone } }, { name: falloff_from_axis, type: bool, default: false, visible_when: { mode: in_cone } },
