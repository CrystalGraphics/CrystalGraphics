      { name: mesh, type: struct, forms: [constant, binding] },
      { name: offsets, type: array, quantity: offset }, { name: universal_offset, type: vec3, quantity: offset },
      { name: selection, type: enum, values: [random, sequential], default: random },
      { name: update_each_frame, type: bool }, { name: orient_meshes, type: bool },
      { name: inherit_velocity, type: float },
      { name: segments, type: bool }, { name: offset, type: float, quantity: length },
      { name: bias, type: enum, values: [none, along, against, away_from_end], default: none } ] }
  - { id: skeletal_mesh_location, groups: [particle_spawn], order: spawn_place, unreal: { niagara: SkeletalMeshLocation, cascade: [LocationSkelVertSurface] }, inputs: [
      { name: mesh, type: struct, forms: [constant, binding] }, { name: source, type: enum, values: [vertices, surface] }, { name: bones, type: array },
      { name: orient, type: bool }, { name: inherit_velocity, type: float }, { name: normal_tolerance, type: float, quantity: angle },
