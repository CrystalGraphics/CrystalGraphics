# Takes a version back: its packages on Cloudsmith, its GitHub release and its tag. For a release that went
# out broken and is to be released again at the same version. The release commit stays on master.
#
# Only packages under GROUP are touched: CrystalGUI and CrystalGraphics share the Cloudsmith repository, and
# each carries this file with its own GROUP.
name: Retract

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to take back (x.y.z)
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  retract:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      CLOUDSMITH_PASSWORD: ${{ secrets.CLOUDSMITH_PASSWORD }}
      CLOUDSMITH_REPOSITORY: crystalgraphics/crystalgraphics
      GROUP: com/crystalgraphics
    steps:
      - name: Delete the Cloudsmith packages
        shell: python
        run: |
          import json, os, re, sys, urllib.request

          version = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"::error::'{version}' is not x.y.z")
          api = f"https://api.cloudsmith.io/v1/packages/{os.environ['CLOUDSMITH_REPOSITORY']}/"
          key = {"X-Api-Key": os.environ["CLOUDSMITH_PASSWORD"]}

          def call(url, method="GET"):
              with urllib.request.urlopen(urllib.request.Request(url, headers=key, method=method)) as r:
                  body = r.read()
                  return json.loads(body) if body else None

          print("authenticated as", call("https://api.cloudsmith.io/v1/user/self/").get("slug"))
          packages = []
          page = 1
          while True:
              batch = call(f"{api}?page={page}&page_size=100")
              packages += batch
              if len(batch) < 100:
                  break
              page += 1
          print(len(packages), "packages in the repository")
          def paths(p):
              return [p.get("cdn_url") or ""] + [f.get("cdn_url") or "" for f in p.get("files", [])]
          group = f"/{os.environ['GROUP']}/"
          ours = [p for p in packages if p.get("version") == version and any(group in u for u in paths(p))]
          if not ours:
              print(f"::warning::nothing under {group} at {version} among {len(packages)}")
          for p in ours:
              call(f"{api}{p['slug_perm']}/", "DELETE")
              print("deleted", p["name"], p["version"], paths(p)[0])

      - name: Delete the GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then gh release delete "v$VERSION" --yes; fi
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/v$VERSION" || echo "no tag v$VERSION"
