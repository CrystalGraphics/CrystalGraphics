modLoader = "javafml"
loaderVersion = "[2,)"
license = "LGPL-3.0-or-later"

[[mixins]]
    config = "crystalgraphics.neoforge.mixins.json"

[[dependencies.crystalgraphics]]
    modId = "neoforge"
    type = "required"
    versionRange = "[20.4,)"
    ordering = "NONE"
    side = "CLIENT"

[[dependencies.crystalgraphics]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.20.4,1.21)"
    ordering = "NONE"
    side = "BOTH"

[[mods]]
    modId = "crystalgraphics"
    version = "${file.jarVersion}"
    displayName = "CrystalGraphics"
    description = "Rendering engine library for Minecraft mods."
