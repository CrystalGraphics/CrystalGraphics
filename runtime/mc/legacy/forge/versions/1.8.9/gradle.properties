# legacy forge @ 1.8.9 -- Forge 11.15. Its artifact keeps the old branch suffix; 1.10.2's and 1.12.2's carry none.
mc.version = 1.8.9
forge.version = 11.15.1.2318-1.8.9
minecraft.unimined = true
# joined.srg (obfuscated <-> SRG) and the MCP names over it: what the node compiles against, and the
# MCP -> SRG table the thin jar is renamed with.
mcp.version = 1.8.9
mcp.mappings = stable:22-1.8.9

# The variant this node ships: the whole SRG plateau it runs on, and that Minecraft's pack format.
variant.minecraft = [1.8,1.9)
variant.packFormat = 1
# The render, frame, resize and shutdown hooks: MixinBooter applies them, gated per variant.
variant.mixinPlugin = com.crystalgraphics.mc.shared.CrystalGraphicsLegacyMixins
