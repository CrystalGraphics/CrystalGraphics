# forge @ 1.21.1 -- MinecraftForge 52. Runs Mojang's names, so its jars ship as compiled. 1.21 (Forge 51)
# is refused: it has no HUD event at all, and 52 added AddGuiOverlayLayersEvent.
mc.version = 1.21.1
forge.version = 52.1.16
# Minecraft itself comes through NeoForm: ModDevGradle's legacy mode stops at 1.20.1. @see useForgeApi
neoform.version = 1.21.1-20240808.144430
parchment.mc = 1.21.1
parchment.version = 2024.11.17

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
variant.minecraft = [1.21.1,1.21.2)
variant.packFormat = 34

# Minecraft 1.20.5+ is Java 21, and so are its classes: the node builds for 21. @see cg-java
java.version = 21
