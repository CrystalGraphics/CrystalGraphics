# forge @ 1.21.10 -- MinecraftForge 60. Also claims 1.21.9 (Forge 59). Runs Mojang's names, so its jars ship as compiled.
mc.version = 1.21.10
forge.version = 60.1.15
# Minecraft itself comes through NeoForm: ModDevGradle's legacy mode stops at 1.20.1. @see useForgeApi
neoform.version = 1.21.10-20251010.172816
parchment.mc = 1.21.10
parchment.version = 2025.10.12

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
variant.minecraft = [1.21.9,1.21.11)
variant.packFormat = 69

# Minecraft 1.20.5+ is Java 21, and so are its classes: the node builds for 21. @see cg-java
java.version = 21

# Forge 53+ has no world-render event, so the render hook is a mixin, gated to this node. @see VariantMixins
variant.mixinPlugin = com.crystalgraphics.mc.shared.CrystalGraphicsForgeMixins
