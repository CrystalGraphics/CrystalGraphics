# fabric @ 1.14.4 -- Loom and Mojang's mappings, the only 1.14 with them. 1.14-1.14.3 are refused:
# fabric-api 0.28.5+1.14 declares 1.14.x yet its own mixins fail below 1.14.4, and their older Fabric
# API builds lack lifecycle-events-v1 and networking-api-v1.
mc.version = 1.14.4
fabric.loader = 0.15.11
fabric.api = 0.28.5+1.14

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
variant.minecraft = [1.14.4,1.15)
variant.packFormat = 4

# Fabric API for 1.14 has no event for the world passes; a mixin, gated to this node.
variant.mixinPlugin = com.crystalgraphics.mc.shared.CrystalGraphicsFabricMixins
