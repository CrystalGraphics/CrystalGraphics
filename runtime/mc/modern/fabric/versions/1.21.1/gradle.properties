# fabric @ 1.21.1 -- Loom. Claims 1.21.1 alone: the version it is built and booted on; 1.20.5 to 1.21
# are the rest of its rung and join as they are booted. fabric-api 0.116.x asks for loader >=0.15.11.
mc.version = 1.21.1
fabric.loader = 0.15.11
fabric.api = 0.116.17+1.21.1
parchment.mc = 1.21.1
parchment.version = 2024.11.17

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
