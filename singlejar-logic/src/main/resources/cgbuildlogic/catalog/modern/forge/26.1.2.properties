# forge @ 26.1.2 -- MinecraftForge 64. Runs Mojang's names, so its jars ship as compiled.
mc.version = 26.1.2
forge.version = 64.1.3
# Minecraft itself comes through NeoForm: ModDevGradle's legacy mode stops at 1.20.1. @see useForgeApi
neoform.version = 26.1.2-1

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
# Not 26.1: Forge 62 fails in Minecraft's own bootstrap (FieldToMethodTransformer, FireBlock) before
# any mod loads. 26.1.1 is Forge 63, booted on this node's jar.
variant.minecraft = [26.1.1,26.2)
variant.packFormat = 84

# Minecraft 26.1+ is Java 25, and so are its classes: the node builds for 25. @see cg-java
java.version = 25
