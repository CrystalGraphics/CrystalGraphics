# neoforge @ 26.1.2 -- NeoForge 26.1.2.112, its first stable 26.1 build.
mc.version = 26.1.2
neoforge.version = 26.1.2.112
# The ASM this NeoForge puts on BootstrapLauncher's MODULE PATH -- `strictly 9.9.1` in its metadata.
# @see ../../build.gradle.kts
asm = 9.9.1

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
# 26.1 and 26.1.1 have only NeoForge betas (26.1.0.x, 26.1.1.x); each was booted on this node's jar.
variant.minecraft = [26.1,26.2)
variant.packFormat = 84

# Minecraft 26.1+ is Java 25, and so are its classes: the node builds for 25. @see cg-java
java.version = 25
