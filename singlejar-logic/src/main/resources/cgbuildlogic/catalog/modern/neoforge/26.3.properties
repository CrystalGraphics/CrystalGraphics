# neoforge @ 26.3 -- NeoForge 26.3.0.37, a beta: its only builds so far.
mc.version = 26.3
neoforge.version = 26.3.0.37-beta
# The ASM this NeoForge puts on BootstrapLauncher's MODULE PATH -- `strictly 9.10.1` in its metadata.
# @see ../../build.gradle.kts
asm = 9.10.1

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
variant.minecraft = [26.3,26.4)
variant.packFormat = 97

# Minecraft 26.1+ is Java 25, and so are its classes: the node builds for 25. @see cg-java
java.version = 25
