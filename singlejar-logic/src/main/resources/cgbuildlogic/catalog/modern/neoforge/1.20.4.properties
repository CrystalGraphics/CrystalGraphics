# neoforge @ 1.20.4 -- NeoForge published no 20.1.x series, so this loader's first node is 1.20.4.
mc.version = 1.20.4
neoforge.version = 20.4.251
parchment.mc = 1.20.4
parchment.version = 2024.04.14
# The ASM this NeoForge puts on BootstrapLauncher's MODULE PATH. The run pins every org.ow2.asm artifact
# to it so :language's newer asmVersion cannot promote half the set and leave two jars offering the
# module org.objectweb.asm. @see ../../build.gradle.kts
asm = 9.8

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
variant.minecraft = [1.20.4,1.20.5)
variant.packFormat = 22
