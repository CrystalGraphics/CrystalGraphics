# neoforge @ 1.20.6 -- NeoForge 20.6. Also claims 1.20.5, whose NeoForge (20.5.x) only ever shipped
# betas: booted on both.
mc.version = 1.20.6
neoforge.version = 20.6.141
parchment.mc = 1.20.6
parchment.version = 2024.06.16
# The ASM this NeoForge puts on BootstrapLauncher's MODULE PATH -- `strictly 9.8` in its metadata.
# @see ../../build.gradle.kts
asm = 9.8

# The variant this node ships: the Minecraft range it CLAIMS -- the bootstrapper refuses, by name, any
# version no node claims -- and that Minecraft's resource-pack format.
variant.minecraft = [1.20.5,1.20.7)
variant.packFormat = 32

# Minecraft 1.20.5+ is Java 21, and so are its classes: the node builds for 21. @see cg-java
java.version = 21
